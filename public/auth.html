<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GlassLedger — Sign in</title>
  <style>
    body { font-family: sans-serif; background: #0d1117; color: #e6e6e6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #161b22; padding: 32px; border-radius: 12px; width: 320px; }
    .tabs { display: flex; margin-bottom: 20px; }
    .tabs button { flex: 1; padding: 10px; background: none; border: none; color: #999; cursor: pointer; border-bottom: 2px solid #333; }
    .tabs button.active { color: #fff; border-bottom: 2px solid #6366f1; }
    input { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #333; border-radius: 6px; color: #fff; box-sizing: border-box; }
    button.primary { width: 100%; padding: 10px; background: #6366f1; border: none; border-radius: 6px; color: #fff; cursor: pointer; margin-top: 8px; }
    .google-btn { width: 100%; padding: 10px; background: #fff; color: #333; border: none; border-radius: 6px; cursor: pointer; margin-top: 12px; }
    #error-box { display: none; background: #4a1b0c; color: #f0997b; padding: 8px; border-radius: 6px; margin-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tabs">
      <button id="login-tab" class="active">Login</button>
      <button id="signup-tab">Sign up</button>
    </div>

    <div id="login-form">
      <input type="email" id="login-email" placeholder="Email">
      <input type="password" id="login-password" placeholder="Password">
      <button class="primary" id="login-btn">Log in</button>
      <button class="google-btn">Continue with Google</button>
    </div>

    <div id="signup-form" style="display:none">
      <input type="email" id="signup-email" placeholder="Email">
      <input type="password" id="signup-password" placeholder="Password (min 6 chars)">
      <button class="primary" id="signup-btn">Create account</button>
      <button class="google-btn">Continue with Google</button>
    </div>

    <div id="error-box"></div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
