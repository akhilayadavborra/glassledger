<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassLedger — Procurement Console</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0c; --surface:rgba(255,255,255,0.035); --surface-solid:#101013; --surface-border:rgba(255,255,255,0.08);
    --indigo:#6366f1; --violet:#8b5cf6; --emerald:#10b981; --amber:#e0a63c; --danger:#e0836a;
    --text-primary:#e4e4e8; --text-muted:#84848d;
    --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
    --sidebar-w:250px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text-primary); font-family:var(--body); font-size:14px; }
  a { color:inherit; text-decoration:none; }
  button { font-family:var(--body); }

  /* ---------- layout ---------- */
  #app { display:flex; min-height:100vh; }

  /* sidebar */
  #sidebar {
    width:var(--sidebar-w); flex-shrink:0; background:var(--surface-solid); border-right:1px solid var(--surface-border);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .side-brand { padding:20px 20px; font-family:var(--display); font-weight:700; font-size:15px; border-bottom:1px solid var(--surface-border); display:flex; align-items:center; gap:9px; }
  .side-brand .mark { width:20px; height:20px; border-radius:5px; background:linear-gradient(135deg,var(--indigo),var(--violet)); flex-shrink:0; }
  .side-nav { flex:1; overflow-y:auto; padding:12px 10px; }
  .side-section { margin-bottom:4px; }
  .side-section-label { font-family:var(--mono); font-size:10px; letter-spacing:0.7px; text-transform:uppercase; color:#55555e; padding:14px 12px 6px; }
  .side-section:first-child .side-section-label { padding-top:4px; }
  .side-item {
    display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:7px; cursor:pointer;
    color:var(--text-muted); font-size:13px; font-weight:500; margin-bottom:1px; transition:background 0.15s,color 0.15s;
  }
  .side-item svg { width:15px; height:15px; flex-shrink:0; opacity:0.75; }
  .side-item:hover { background:rgba(255,255,255,0.03); color:var(--text-primary); }
  .side-item.active { background:rgba(99,102,241,0.11); color:#fff; }
  .side-item.active svg { opacity:1; }
  .side-item .dot { display:none; }
  .side-foot { padding:14px; border-top:1px solid var(--surface-border); }
  .side-user { font-family:var(--mono); font-size:11.5px; color:var(--text-muted); margin-bottom:8px; word-break:break-all; }
  .side-logout { width:100%; padding:8px; background:none; border:1px solid var(--surface-border); color:var(--text-muted); border-radius:6px; cursor:pointer; font-size:12.5px; }
  .side-logout:hover { color:#fff; border-color:rgba(255,255,255,0.25); }

  /* main */
  #main { flex:1; min-width:0; }
  #topbar { display:flex; justify-content:space-between; align-items:center; padding:20px 32px; border-bottom:1px solid var(--surface-border); }
  #topbar h1 { font-family:var(--display); font-size:20px; }
  #topbar .subtitle { color:var(--text-muted); font-size:12.5px; margin-top:2px; }
  .env-note { font-family:var(--mono); font-size:11px; color:var(--text-muted); background:rgba(255,255,255,0.03); border:1px solid var(--surface-border); padding:5px 10px; border-radius:6px; }
  #content { padding:28px 32px; }
  .view { display:none; }
  .view.active { display:block; }

  /* ---------- shared components ---------- */
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:26px; }
  .kpi-card { background:var(--surface); border:1px solid var(--surface-border); border-radius:12px; padding:16px 18px; }
  .kpi-card .label { font-family:var(--mono); font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
  .kpi-card .value { font-family:var(--display); font-size:22px; font-weight:600; margin-top:6px; }
  .kpi-card .value.green { color:var(--emerald); }
  .kpi-card .value.indigo { color:var(--indigo); }
  .kpi-card .value.amber { color:var(--amber); }
  .kpi-card .sub { font-size:10.5px; color:#5c5c66; margin-top:4px; }
  .kpi-grid-secondary { margin-bottom:0; }
  .kpi-grid-secondary .kpi-card { background:rgba(255,255,255,0.02); }

  /* lifecycle timeline (Procurement Detail) */
  .lc-track { display:flex; flex-direction:column; }
  .lc-row { display:flex; gap:12px; position:relative; padding-bottom:18px; }
  .lc-row:last-child { padding-bottom:0; }
  .lc-row::before { content:''; position:absolute; left:5px; top:14px; bottom:-4px; width:1px; background:var(--surface-border); }
  .lc-row:last-child::before { display:none; }
  .lc-dot { width:11px; height:11px; border-radius:50%; margin-top:2px; flex-shrink:0; background:var(--surface-border); border:2px solid var(--bg); z-index:1; }
  .lc-row.lc-done .lc-dot { background:var(--emerald); }
  .lc-row.lc-current .lc-dot { background:var(--indigo); }
  .lc-row.lc-warn .lc-dot { background:var(--amber); }
  .lc-row.lc-pending .lc-dot { background:rgba(255,255,255,0.12); }
  .lc-body { flex:1; }
  .lc-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .lc-label { font-size:12.5px; font-weight:600; color:var(--text-primary); }
  .lc-row.lc-pending .lc-label { color:#5c5c66; font-weight:500; }
  .lc-row.lc-current .lc-label { color:var(--indigo); }
  .lc-time { font-size:10.5px; color:var(--text-muted); font-family:var(--mono); white-space:nowrap; }
  .lc-record { font-size:11px; color:var(--text-muted); margin-top:2px; }
  .lc-notyet { font-size:11px; color:#5c5c66; margin-top:2px; font-style:italic; }
  .lc-row.clickable { cursor:pointer; }
  .lc-row.clickable .lc-label { text-decoration:underline; text-decoration-color:rgba(255,255,255,0.25); text-underline-offset:3px; }
  .lc-row.clickable:hover .lc-label { color:var(--indigo); text-decoration-color:var(--indigo); }
  @keyframes lcFlash { 0%,100% { background:transparent; } 30% { background:rgba(99,102,241,0.18); } }
  .lc-flash { animation:lcFlash 1.2s ease; border-radius:6px; }

  .panel { background:var(--surface); border:1px solid var(--surface-border); border-radius:12px; padding:20px; margin-bottom:20px; }
  .panel h2 { font-family:var(--display); font-size:14.5px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .panel h2 .action-btn { font-size:11.5px; font-weight:500; color:var(--violet); background:none; border:1px solid rgba(139,92,246,0.35); padding:5px 11px; border-radius:6px; cursor:pointer; }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  thead th { text-align:left; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); padding:8px 10px; border-bottom:1px solid var(--surface-border); }
  tbody td { padding:10px; border-bottom:1px solid var(--surface-border); color:var(--text-primary); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr.clickable { cursor:pointer; }
  tbody tr.clickable:hover { background:rgba(255,255,255,0.02); }
  .rec-link { color:var(--text-primary); text-decoration:none; border-bottom:1px solid rgba(255,255,255,0.18); transition:color 0.15s,border-color 0.15s; }
  .rec-link:hover { color:var(--indigo); border-color:var(--indigo); }
  .mono { font-family:var(--mono); }
  .muted { color:var(--text-muted); }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; }
  .badge.green { background:rgba(16,185,129,0.12); color:var(--emerald); border:1px solid rgba(16,185,129,0.35); }
  .badge.amber { background:rgba(245,166,35,0.12); color:var(--amber); border:1px solid rgba(245,166,35,0.35); }
  .badge.red { background:rgba(240,153,123,0.12); color:var(--danger); border:1px solid rgba(240,153,123,0.35); }
  .badge.indigo { background:rgba(99,102,241,0.12); color:var(--indigo); border:1px solid rgba(99,102,241,0.35); }
  .badge.gray { background:rgba(255,255,255,0.05); color:var(--text-muted); border:1px solid var(--surface-border); }

  .empty-state { text-align:center; padding:36px 16px; color:var(--text-muted); font-size:13px; }
  .empty-state .big { font-size:26px; margin-bottom:8px; }

  .btn { padding:8px 15px; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer; border:none; }
  .btn-primary { background:var(--indigo); color:#fff; }
  .btn-primary:hover { background:#5457e0; }
  .btn-ghost { background:none; border:1px solid var(--surface-border); color:var(--text-muted); }
  .btn-ghost:hover { color:#fff; border-color:rgba(255,255,255,0.25); }
  .btn-danger { background:rgba(224,131,106,0.12); border:1px solid rgba(224,131,106,0.35); color:var(--danger); }
  .btn-green { background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.35); color:var(--emerald); }
  .btn-sm { padding:5px 10px; font-size:11.5px; }
  .btn:disabled { opacity:0.45; cursor:not-allowed; }
  .btn-row { display:flex; gap:8px; }

  /* sub-tabs */
  .subtabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--surface-border); }
  .subtab { padding:9px 14px; font-size:12.5px; font-weight:500; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .subtab:hover { color:var(--text-primary); }
  .subtab.active { color:#fff; border-bottom-color:var(--indigo); }

  /* search + sort */
  .table-toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .search-input { padding:7px 11px; background:rgba(255,255,255,0.03); border:1px solid var(--surface-border); border-radius:7px; color:#fff; font-size:12.5px; width:220px; }
  .search-input:focus { outline:none; border-color:rgba(255,255,255,0.22); }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--text-primary); }
  th.sortable .arrow { opacity:0.5; margin-left:3px; }

  /* demo controls box */
  .demo-box { border:1px dashed var(--surface-border); border-radius:10px; padding:14px 16px; margin-top:18px; background:rgba(255,255,255,0.015); }
  .demo-box .demo-label { font-family:var(--mono); font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:#5c5c66; margin-bottom:8px; }
  .demo-box .demo-desc { font-size:11.5px; color:var(--text-muted); margin-bottom:10px; }

  /* bar chart (dependency-free) */
  .bar-chart { display:flex; align-items:flex-end; gap:8px; height:160px; padding-top:10px; }
  .bar-chart .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .bar-chart .bar { width:100%; max-width:34px; background:var(--indigo); border-radius:4px 4px 0 0; min-height:2px; }
  .bar-chart .bar-label { font-size:10px; color:var(--text-muted); text-align:center; }
  .bar-chart .bar-value { font-size:10.5px; color:var(--text-primary); font-family:var(--mono); }

  /* inventory meter */
  .inv-track { height:10px; border-radius:6px; background:rgba(255,255,255,0.06); overflow:hidden; margin:10px 0; }
  .inv-fill { height:100%; background:linear-gradient(90deg,var(--emerald),var(--indigo)); transition:width 0.6s linear,background 0.4s; }
  .inv-fill.low { background:linear-gradient(90deg,var(--danger),#e05c3f); }

  /* agent state */
  .state-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .state-pill { font-family:var(--mono); font-size:12px; padding:7px 16px; border-radius:20px; background:rgba(99,102,241,0.12); border:1px solid rgba(99,102,241,0.4); color:var(--indigo); }
  .state-pill.failure { background:rgba(240,153,123,0.12); border-color:rgba(240,153,123,0.4); color:var(--danger); }
  .state-pill.success { background:rgba(16,185,129,0.12); border-color:rgba(16,185,129,0.4); color:var(--emerald); }
  .state-pill.idle { background:rgba(255,255,255,0.04); border-color:var(--surface-border); color:var(--text-muted); }
  .state-steps { display:flex; gap:6px; }
  .state-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.1); }
  .state-dot.done { background:var(--emerald); }
  .state-dot.activeDot { background:var(--indigo); }
  .recovery-btn { font-size:12px; padding:6px 14px; border-radius:6px; cursor:pointer; background:rgba(240,153,123,0.12); border:1px solid rgba(240,153,123,0.4); color:var(--danger); }

  .activity-log { font-family:var(--mono); font-size:12px; line-height:1.9; min-height:100px; max-height:340px; overflow-y:auto; color:#cfcfe0; }
  .activity-log .line { opacity:0; animation:lineIn 0.35s ease forwards; padding:2px 0; }
  .activity-log .line.blocked { color:var(--danger); }
  .activity-log .line.ok { color:#cfcfe0; }
  .activity-log .line.rationale { color:var(--violet); font-style:italic; }
  @keyframes lineIn { to { opacity:1; } }

  .comparison-table th,.comparison-table td { text-align:right; font-family:var(--mono); font-size:11.5px; }
  .comparison-table th:first-child,.comparison-table td:first-child { text-align:left; }
  .comparison-table tr.chosen td { color:var(--emerald); font-weight:600; }
  .comparison-table tr.chosen { background:rgba(16,185,129,0.06); }

  .approval-reason { margin-top:10px; padding:10px 12px; border-radius:8px; font-size:12px; background:rgba(224,166,60,0.08); border:1px solid rgba(224,166,60,0.28); color:var(--amber); }
  .policy-rules { margin-top:8px; }
  .policy-rules-label { font-family:var(--mono); font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:#5c5c66; margin-bottom:6px; }
  .policy-rule-combined { font-family:var(--mono); font-size:12px; color:var(--amber); margin-bottom:8px; padding:6px 10px; background:rgba(224,166,60,0.08); border-radius:6px; display:inline-block; }
  .verify-badge { font-family:var(--mono); font-size:12px; font-weight:600; padding:8px 12px; border-radius:8px; margin-bottom:12px; }
  .verify-ok { background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); color:var(--emerald); }
  .verify-fail { background:rgba(224,131,106,0.1); border:1px solid rgba(224,131,106,0.35); color:var(--danger); }
  .verify-fail-msg { font-family:var(--body); font-weight:400; font-size:11.5px; margin-top:4px; opacity:0.9; }

  /* loading skeleton */
  .skeleton-panel { padding:4px 0; }
  .skel-line, .skel-row { background:linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 37%, rgba(255,255,255,0.04) 63%); background-size:400% 100%; animation:skelShimmer 1.4s ease infinite; border-radius:6px; }
  .skel-line { height:14px; margin-bottom:20px; }
  .skel-line.w60 { width:60%; } .skel-line.w40 { width:40%; }
  .skel-row { height:52px; margin-bottom:10px; }
  @keyframes skelShimmer { 0% { background-position:100% 50%; } 100% { background-position:0 50%; } }

  /* error state */
  .error-panel { text-align:center; padding:40px 20px; }
  .error-icon { font-size:26px; color:var(--danger); margin-bottom:10px; }
  .error-title { font-family:var(--display); font-size:14px; font-weight:600; margin-bottom:6px; }
  .error-msg { font-size:12px; color:var(--text-muted); margin-bottom:16px; }

  /* agent active/idle badge */
  .agent-badge { display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:0.5px; color:#5c5c66; background:rgba(255,255,255,0.04); border:1px solid var(--surface-border); border-radius:20px; padding:4px 10px; }
  .agent-badge-dot { width:6px; height:6px; border-radius:50%; background:#5c5c66; }
  .agent-badge.active { color:var(--indigo); border-color:rgba(99,102,241,0.4); background:rgba(99,102,241,0.08); }
  .agent-badge.active .agent-badge-dot { background:var(--indigo); box-shadow:0 0 6px rgba(99,102,241,0.7); animation:agentPulse 1.6s ease infinite; }
  @keyframes agentPulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .policy-rule-row { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; background:rgba(224,166,60,0.06); border:1px solid rgba(224,166,60,0.22); margin-bottom:6px; }
  .policy-rule-detail { font-size:12px; color:var(--text-muted); }

  /* modal */
  #modalOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:500; padding:20px; }
  #modalOverlay.show { display:flex; }
  #modalBox { background:var(--surface-solid); border:1px solid var(--surface-border); border-radius:14px; max-width:640px; width:100%; max-height:85vh; overflow-y:auto; padding:26px; }
  #modalBox .modal-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  #modalBox h3 { font-family:var(--display); font-size:17px; }
  #modalClose { background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer; }

  /* toasts */
  #toastContainer { position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:10px; z-index:999; }
  .toast { font-size:13px; padding:11px 16px; border-radius:10px; backdrop-filter:blur(10px); box-shadow:0 12px 30px -10px rgba(0,0,0,0.6); animation:toastIn 0.3s ease,toastOut 0.3s ease 2.7s forwards; max-width:320px; }
  .toast.success { background:rgba(16,185,129,0.14); border:1px solid rgba(16,185,129,0.4); color:var(--emerald); }
  .toast.error { background:rgba(240,153,123,0.14); border:1px solid rgba(240,153,123,0.4); color:var(--danger); }
  @keyframes toastIn { from{opacity:0;transform:translateX(20px);} to{opacity:1;transform:translateX(0);} }
  @keyframes toastOut { to{opacity:0;transform:translateX(20px);} }

  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  .ask-row { display:flex; gap:10px; margin-bottom:12px; }
  .ask-row input { flex:1; padding:10px 12px; background:rgba(255,255,255,0.03); border:1px solid var(--surface-border); border-radius:8px; color:#fff; font-size:13px; }
  .ask-row input:focus { outline:none; border-color:var(--violet); }
  #askAnswer { font-family:var(--mono); font-size:12.5px; color:var(--text-muted); line-height:1.6; }

  .match-row,.audit-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--surface-border); font-size:12px; }
  .match-row:last-child,.audit-row:last-child { border-bottom:none; }

  @media (max-width:900px) {
    #sidebar { width:64px; }
    .side-item span.label { display:none; }
    .side-brand { font-size:0; }
    .two-col { grid-template-columns:1fr; }
    .kpi-grid { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<div id="app">
  <nav id="sidebar">
    <div class="side-brand"><span class="mark"></span>GlassLedger</div>
    <div class="side-nav" id="sideNav"></div>
    <div class="side-foot">
      <div class="side-user" id="sideUser">Loading…</div>
      <button class="side-logout" id="logoutBtn">Log out</button>
    </div>
  </nav>

  <div id="main">
    <div id="topbar">
      <div>
        <h1 id="viewTitle">Overview</h1>
        <div class="subtitle" id="viewSubtitle">What's happening in your procurement operation right now</div>
      </div>
      <div class="env-note">Payments executed through Razorpay's test environment</div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modalOverlay"><div id="modalBox"></div></div>
<div id="toastContainer"></div>

<script type="module">
  import { auth } from "./js/firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = 'auth.html';
    else {
      const label = user.email || user.displayName || 'Signed in';
      document.getElementById('sideUser').textContent = label;
      const settingsCell = document.getElementById('settingsSignedInAs');
      if (settingsCell) settingsCell.textContent = label;
    }
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'auth.html';
  });
</script>

<script>
// =============================================================================
// Global state
// =============================================================================
let vendorsCache = [];
let jobsCache = [];
let currentInventoryEventId = null;
let currentJobId = null;
let currentDecision = null;
let currentSavings = 0;
let failedVendorIds = [];
let inventoryLevel = 100;

function switchView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.side-item').forEach(s => s.classList.toggle('active', s.dataset.view === id));
  const viewEl = document.getElementById(id + 'View');
  viewEl.classList.add('active');
  const nav = NAV.find(n => n.id === id);
  document.getElementById('viewTitle').textContent = nav.label;
  document.getElementById('viewSubtitle').textContent = nav.sub;
  if (REFRESHERS[id]) {
    viewEl.innerHTML = `<div class="skeleton-panel"><div class="skel-line w60"></div><div class="skel-line w40"></div><div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div></div>`;
    Promise.resolve(REFRESHERS[id]()).catch(err => {
      console.error(`Failed to load ${id}:`, err);
      viewEl.innerHTML = `<div class="panel error-panel">
        <div class="error-icon">⚠</div>
        <div class="error-title">Couldn't load this page</div>
        <div class="error-msg">${(err && err.message) || 'Something went wrong talking to the server.'}</div>
        <button class="btn btn-ghost btn-sm" onclick="switchView('${id}')">Retry</button>
      </div>`;
    });
  }
}
document.getElementById('sideNav').addEventListener('click', (e) => {

});

function showToast(message, type = 'success') {

function statusBadge(status) {
  const map = {
    reconciled: ['green','✓','Completed'], approved: ['green','✓','Approved'],
    order_created: ['indigo','●','Processing'], guardrail_passed: ['indigo','●','Processing'],
    awaiting_approval: ['amber','!','Approval Required'], analyzing: ['indigo','●','AI Processing'],
    rejected: ['red','✕','Rejected'], payment_failed: ['red','✕','Failed'],
    ai_failed: ['red','✕','Manual Review'], failed: ['red','✕','Failed']
  };
  const [cls, icon, text] = map[status] || ['gray','—',status];
  return `<span class="badge ${cls}">${icon} ${text}</span>`;
}

function updateInventoryUI() {
  const fill = document.getElementById('invFill');
  const pct = document.getElementById('invPct');

  if (fill) { fill.style.width = inventoryLevel + '%'; fill.classList.toggle('low', inventoryLevel <= 20); }
  if (pct) pct.textContent = Math.round(inventoryLevel) + '%';
  if (pct2) pct2.textContent = Math.round(inventoryLevel) + '%';
  document.querySelectorAll('#inventoryView .badge.green,#inventoryView .badge.amber,#inventoryView .badge.red').forEach(badgeHost => {

    badgeHost.className = `badge ${cls}`;
    badgeHost.textContent = label;
  });

  if (autoTriggerLock) return;
  inventoryLevel = Math.max(0, inventoryLevel - 2);
  updateInventoryUI();
  if (inventoryLevel <= 20) {
    failedVendorIds = [];
    currentInventoryEventId = crypto.randomUUID();
    runDecisionFlow([]).then(() => { inventoryLevel = 100; updateInventoryUI(); });
  }
}, 1500);

let requestsSort = { key: null, dir: 1 };
function renderRequestsTable(filterText) {
  const host = document.getElementById('requestsTableHost');
  if (!host) return;
  let rows = jobsCache.filter(j => !filterText ||
    (j.vendorName || '').toLowerCase().includes(filterText) ||
    j.jobId.toLowerCase().includes(filterText) ||
    j.status.toLowerCase().includes(filterText));
  if (requestsSort.key) {
    rows = rows.slice().sort((a, b) => {
      const av = a[requestsSort.key] ?? '', bv = b[requestsSort.key] ?? '';
      return (av > bv ? 1 : av < bv ? -1 : 0) * requestsSort.dir;
    });
  }
  host.innerHTML = rows.length ? `
    <table>
      <thead><tr>
        <th class="sortable" data-key="jobId">Request</th>
        <th>Item</th>
        <th class="sortable" data-key="payableAmount">Priority</th>
        <th class="sortable" data-key="vendorName">Vendor</th>
        <th class="sortable" data-key="payableAmount">Amount</th>
        <th class="sortable" data-key="status">Status</th>
      </tr></thead>
      <tbody>${rows.map(j => `
        <tr class="clickable" onclick="openJobDetail('${j.jobId}')">
          <td class="mono">${j.jobId.slice(0,8)}</td>
          <td>0.5mm Copper Wire</td>
          <td>${j.payableAmount > 10000 ? 'High' : 'Normal'}</td>
          <td>${linkVendor(j.vendorId, j.vendorName || '—')}</td>
          <td>₹${j.payableAmount || 0}</td>
          <td>${statusBadge(j.status)}</td>
        </tr>`).join('')}</tbody>
    </table>
  ` : `<div class="empty-state"><div class="big">📋</div>No procurement requests match.</div>`;
  host.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      requestsSort.dir = requestsSort.key === key ? -requestsSort.dir : 1;
      requestsSort.key = key;
      renderRequestsTable(document.getElementById('requestsSearch').value.trim().toLowerCase());
    });
  });
}

const LIFECYCLE_STAGES = [
  { key: 'inventory_threshold_crossed', label: 'Detected' },
  { key: 'vendor_selected', label: 'AI Decision' },
  { key: ['guardrail_passed','guardrail_blocked'], label: 'Policy Check' },
  { key: 'approval_received', label: 'Approval', optional: true },
  { key: 'purchase_order_created', label: 'Purchase Order', recordField: 'poNumber' },
  { key: 'razorpay_order_created', label: 'Razorpay Order', recordField: 'orderId' },
  { key: ['signature_verified','payment_received'], label: 'Payment Verified', recordField: 'paymentId' },
  { key: 'ledger_reconciled', label: 'Ledger Reconciled' },
  { key: 'receipt_generated', label: 'Receipt', recordField: 'receiptNumber' }
];
function findEvent(job, key) {
  const keys = Array.isArray(key) ? key : [key];
  return job.events.find(e => keys.includes(e.event));
}
const LC_NOT_YET = {
  'AI Decision': 'AI has not evaluated vendors yet.', 'Policy Check': 'Policy has not been evaluated yet.',
  'Approval': 'No approval required — order passed policy automatically.',
  'Purchase Order': 'Purchase order not created yet.', 'Razorpay Order': 'Razorpay order not created yet.',
  'Payment Verified': 'Payment not created yet.', 'Ledger Reconciled': 'Ledger has not been reconciled yet — payment not verified.',
  'Receipt': 'Receipt not generated yet — awaiting verified payment.'
};
function lifecycleAction(stageLabel, job) {
  if (stageLabel === 'Purchase Order') return `downloadPO('${job.jobId}')`;
  if (stageLabel === 'Receipt') return `downloadReceipt('${job.jobId}')`;
  if (stageLabel === 'Razorpay Order' || stageLabel === 'Payment Verified') return `flashPaymentInfo()`;
  if (stageLabel === 'Ledger Reconciled') return `closeModal(); location.hash='#/ledger/${job.jobId}';`;
  return null;
}
function buildLifecycleHtml(job) {
  let reachedCurrent = false;
  const rows = LIFECYCLE_STAGES.map(stage => {
    if (stage.optional && !findEvent(job, 'approval_requested')) return null; // skip approval step if never required
    const ev = findEvent(job, stage.key);
    const failed = ev && ev.status === 'blocked' && stage.label === 'Policy Check';
    const done = !!ev;
    const recordVal = stage.recordField ? job[stage.recordField] : null;
    let stateClass = done ? (failed ? 'lc-warn' : 'lc-done') : 'lc-pending';
    let isCurrent = false;
    if (!done && !reachedCurrent && job.status !== 'failed' && job.status !== 'rejected') { isCurrent = true; reachedCurrent = true; stateClass = 'lc-current'; }
    const action = done ? lifecycleAction(stage.label, job) : null;
    return `
      <div class="lc-row ${stateClass}${action ? ' clickable' : ''}" ${action ? `data-lc-action="${action.replace(/"/g,'&quot;')}"` : ''}>
        <div class="lc-dot"></div>
        <div class="lc-body">
          <div class="lc-top"><span class="lc-label">${stage.label}${failed ? ' — approval required' : ''}</span>${ev ? `<span class="lc-time">${new Date(ev.timestamp).toLocaleString()}</span>` : isCurrent ? `<span class="lc-time">in progress…</span>` : ''}</div>
          ${recordVal ? `<div class="lc-record mono">${recordVal}</div>` : ''}
          ${!done && !isCurrent ? `<div class="lc-notyet">${LC_NOT_YET[stage.label] || 'Not reached yet.'}</div>` : ''}
        </div>
      </div>`;
  }).filter(Boolean).join('');
  return `<div class="lc-track">${rows}</div>`;
}

function setState(stateName, mode) {
  const pill = document.getElementById('statePill');
  if (!pill) return;
  pill.textContent = stateName;
  pill.className = 'state-pill' + (mode === 'failure' ? ' failure' : mode === 'success' ? ' success' : mode === 'idle' ? ' idle' : '');
  const badge = document.getElementById('agentActiveBadge');
  if (badge) {
    const isActive = mode !== 'idle';
    badge.classList.toggle('active', isActive);
    badge.innerHTML = `<span class="agent-badge-dot"></span>${isActive ? 'ACTIVE' : 'IDLE'}`;
  }
  const idx = STATES.indexOf(stateName);
  document.querySelectorAll('.state-dot').forEach((dot,i) => {
    dot.classList.remove('done','activeDot');
    if (mode === 'failure' || idx === -1) return;
    if (i < idx) dot.classList.add('done');
    if (i === idx) dot.classList.add('activeDot');
  });
}
function setFailureState(label, recoveryLabel, fn) {
  const pill = document.getElementById('statePill');
  if (pill) { pill.textContent = label; pill.className = 'state-pill failure'; }
  const existing = document.getElementById('recoveryBtn');
  if (existing) existing.remove();
  const btn = document.createElement('button');
  btn.id = 'recoveryBtn'; btn.className = 'recovery-btn'; btn.textContent = recoveryLabel;
  btn.onclick = () => { btn.remove(); fn(); };
  const row = document.querySelector('#agentView .state-row');
  if (row) row.appendChild(btn);
}
function renderAgentLog(lines) {
  const el = document.getElementById('agentLog');
  if (!el) return;
  el.innerHTML = lines.map((l,i) => {
    const cls = l.toLowerCase().includes('fail') || l.toLowerCase().includes('blocked') || l.toLowerCase().includes('eliminated') ? 'blocked'
      : l.toLowerCase().includes('rationale') ? 'rationale' : 'ok';
    return `<div class="line ${cls}" style="animation-delay:${i*0.06}s">• ${l}</div>`;
  }).join('');

async function runDecisionFlow(excludeVendorIds) {
  if (autoTriggerLock) return;
  autoTriggerLock = true;
  if (!document.getElementById('agentView').innerHTML) renderAgentView();
  document.getElementById('approvalActions').style.display = 'none';
  document.getElementById('approvalReason').style.display = 'none';
  document.getElementById('failoverBtn').style.display = 'none';
  document.getElementById('currentTaskLabel').textContent = 'Analyzing new procurement request…';

  setState('Inventory alert');
  await new Promise(r => setTimeout(r, 350));
  setState('Vendor analysis');
  document.getElementById('agentLog').textContent = 'Agent thinking…';

  let data;
  try {
    const res = await fetch('/api/decide', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ inventoryEventId: currentInventoryEventId, excludeVendorIds })
    });
    data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Decision failed');
    if (data.alreadyProcessed) {
      renderAgentLog(data.activityLog);
      showToast(data.message, 'error');
      setState('Monitoring', 'idle');
      autoTriggerLock = false;
      return;
    }
  } catch (err) {
    setFailureState('AI failure', 'Engage safe fallback', async () => {
      setState('Vendor analysis');
      try {
        const fbRes = await fetch('/api/decide-fallback', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ inventoryEventId: currentInventoryEventId, excludeVendorIds })
        });
        const fbData = await fbRes.json();
        if (!fbRes.ok) throw new Error(fbData.error || 'Fallback failed');
        showToast('Safe fallback engaged — deterministic selection used, manual review required', 'error');
        applyDecision(fbData);
      } catch (fbErr) {
        showToast(fbErr.message, 'error');
        setState('Monitoring', 'idle');
        autoTriggerLock = false;
      }
    });
    return;
  }
  applyDecision(data);
}

function applyDecision(data) {
  currentJobId = data.jobId;
  currentDecision = data.decision;
  currentSavings = data.savings || 0;
  renderAgentLog(data.activityLog);
  renderComparisonTable(data.costComparison, data.decision.id);
  document.getElementById('currentTaskLabel').textContent = `Procuring 0.5mm Copper Wire — evaluating ${data.decision.name}`;
  document.getElementById('failoverBtn').style.display = 'block';
  setState('Vendor selected');

  setTimeout(() => {
    setState('Guardrail check');
    setTimeout(() => {
      if (data.requiresApproval) {
        document.getElementById('approvalReason').textContent = data.approvalReason;
        document.getElementById('approvalReason').style.display = 'block';
        document.getElementById('approvalActions').style.display = 'flex';
      } else {
        startPayment(data.decision, data.jobId);
      }
      autoTriggerLock = false;
    }, 450);
  }, 350);
}

function onFailoverClick() {
  const btn = document.getElementById('failoverBtn');
  btn.disabled = true;
  const failedVendor = currentDecision;
  setFailureState('Vendor failure', 'Re-evaluate vendors', async () => {
    renderAgentLog([`ERROR — connection timeout contacting ${failedVendor.name}`]);
    showToast(`${failedVendor.name} unreachable`, 'error');
    await new Promise(r => setTimeout(r, 700));
    await fetch('/api/record-vendor-failure', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ jobId: currentJobId, vendorId: failedVendor.id, vendorName: failedVendor.name, reason:'connection timeout' })
    });
    failedVendorIds.push(failedVendor.id);
    setState('Vendor analysis');
    btn.disabled = false;
    runDecisionFlow(failedVendorIds);
  });
}

async function startPayment(vendor, jobId) {
  setState('Payment');
  const res = await fetch('/api/create-order', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ jobId }) });
  const order = await res.json();
  if (!res.ok) {
    setFailureState('Payment failure', 'Retry payment', () => startPayment(vendor, jobId));
    showToast(order.error || 'Order creation failed', 'error');
    return;
  }
  const options = {
    key: order.keyId, amount: order.amount, currency: order.currency, name:'GlassLedger',
    description: `Procurement — ${order.vendorName} (PO ${order.poNumber || ''})`, order_id: order.orderId,
    modal: { ondismiss: () => setFailureState('Payment failure', 'Retry payment', () => startPayment(vendor, jobId)) },
    handler: async (response) => {
      setState('Payment verification');
      const verifyRes = await fetch('/api/verify-payment', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ jobId, razorpay_order_id: response.razorpay_order_id, razorpay_payment_id: response.razorpay_payment_id, razorpay_signature: response.razorpay_signature })
      });
      const result = await verifyRes.json();
      if (result.verified) {
        setState('Reconciliation', 'success');
        showToast(`Payment settled — ₹${vendor.cost} to ${vendor.name} (test environment)`, 'success');
        setTimeout(() => setState('Monitoring', 'idle'), 2200);
      } else {
        setFailureState('Payment failure', 'Manual review', () => setState('Monitoring', 'idle'));
        showToast(result.error || 'Payment could not be verified. The ledger has not been updated.', 'error');
      }
    },
    theme: { color:'#6366f1' }
  };
  const rzp = new Razorpay(options);
  rzp.on('payment.failed', () => setFailureState('Payment failure', 'Retry payment', () => startPayment(vendor, jobId)));
  rzp.open();
}

  openModal(`${vendor.name}`, `

// HASH ROUTING — deep-linkable records (#/vendor/:id, #/procurement/:jobId, etc.)
// =============================================================================
function handleRoute() {
  const hash = location.hash;
  const m = hash.match(/^#\/(vendor|procurement|po|payment|receipt|ledger)\/(.+)$/);
  if (!m) return;
  const [, kind, id] = m;
  const routeMap = { vendor: 'vendors', procurement: 'requests', po: 'po', payment: 'payments', receipt: 'documents', ledger: 'ledger' };
  switchView(routeMap[kind] || 'overview');
  setTimeout(() => {
    if (kind === 'vendor') openVendorDetail(id);
    else openJobDetail(id);
  }, 60);
}
window.addEventListener('hashchange', handleRoute);

            <td class="mono muted">${(t.poNumber)||'—'}</td>
          </tr>`).join('')}</tbody>
      </table>` : `<div class="empty-state"><div class="big">📊</div>No ledger entries match.</div>`;

  document.getElementById('exportCsvBtn').addEventListener('click', () => {
    if (!ledger.transactions.length) { showToast('No transactions to export yet', 'error'); return; }
    const header = 'Transaction ID,Date,Vendor,Amount,Payment Status,Procurement ID,Razorpay Order ID,Razorpay Payment ID\n';
    const rows = ledger.transactions.map(t => `${t.paymentId},${t.timestamp},"${t.vendor}",${t.amount},reconciled,${t.jobId||''},${t.orderId},${t.paymentId}`).join('\n');
    const blob = new Blob([header+rows], { type:'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `glassledger_ledger_${Date.now()}.csv`; a.click();
    URL.revokeObjectURL(url);
  });
}

function barChart(labels, values, prefix) {
  const max = Math.max(1, ...values);
  return `<div class="bar-chart">${labels.map((l,i) => `
    <div class="bar-col">
      <div class="bar-value">${prefix}${values[i].toLocaleString('en-IN')}</div>
      <div class="bar" style="height:${Math.max(3, (values[i]/max)*120)}px;"></div>
      <div class="bar-label">${l}</div>
    </div>`).join('')}</div>`;
}
async function refreshAnalytics() {
  const res = await fetch('/api/ledger');
  const ledger = await res.json();
  const txns = ledger.transactions;

  // spend by day (last 7 entries chronological)
  const byDay = {};
  txns.forEach(t => { const d = new Date(t.timestamp).toLocaleDateString('en-IN',{month:'short',day:'numeric'}); byDay[d] = (byDay[d]||0) + t.amount; });
  const dayLabels = Object.keys(byDay).slice(-7);
  const dayValues = dayLabels.map(l => byDay[l]);

  // spend by vendor
  const byVendor = {};
  txns.forEach(t => { byVendor[t.vendor] = (byVendor[t.vendor]||0) + t.amount; });
  const vendorLabels = Object.keys(byVendor).slice(0,6);
  const vendorValues = vendorLabels.map(l => byVendor[l]);

  document.getElementById('analyticsView').innerHTML = `
    <div class="two-col">
      <div class="panel">
        <h2>Spend over time</h2>
        ${dayLabels.length ? barChart(dayLabels, dayValues, '₹') : '<div class="empty-state">No spend data yet.</div>'}
      </div>
      <div class="panel">
        <h2>Spend by vendor</h2>
        ${vendorLabels.length ? barChart(vendorLabels, vendorValues, '₹') : '<div class="empty-state">No spend data yet.</div>'}
      </div>
    </div>
    <div class="panel">
      <h2>Summary</h2>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="label">Total transactions</div><div class="value">${txns.length}</div></div>
        <div class="kpi-card"><div class="label">Total settled</div><div class="value green">₹${ledger.totalSettled.toLocaleString('en-IN')}</div></div>
        <div class="kpi-card"><div class="label">Total savings</div><div class="value indigo">₹${(ledger.totalSaved||0).toLocaleString('en-IN')}</div></div>
      </div>
    </div>
  `;
}

  doc.setFontSize(18); doc.text('GlassLedger', 20, 20);

  doc.text(`PO Number: ${job.poNumber}`, 20, 45);
  doc.text(`Procurement ID: ${job.jobId}`, 20, 53);
  doc.text(`Vendor: ${job.vendorName}`, 20, 61);
  doc.text(`Item: 0.5mm Copper Wire`, 20, 69);

  doc.text(`Status: ${job.status}`, 20, 85);
  doc.setFontSize(9); doc.setTextColor(140);
  doc.text('GlassLedger — autonomous procurement, test environment', 20, 105);
  doc.save(`${job.poNumber}.pdf`);
}
